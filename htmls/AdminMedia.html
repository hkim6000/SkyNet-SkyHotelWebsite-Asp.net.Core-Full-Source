<div class="ml-site ml-admin" id="ml-site" data-theme="light" style="{plhd_style}">
<header class="ml-ahead">
    <button type="button" class="ml-ibtn ml-burger" aria-label="Menu" onclick="AdminMediaJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ml-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="ml-demo" id="ml-demo"></span>
    <span class="ml-grow"></span>
    <a class="ml-who" id="ml-who" href="AdminAccount"></a>
    <a class="ml-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ml-out" onclick="AdminMediaJs.signOut()">Sign out</button>
</header>
<aside class="ml-side" id="ml-nav" aria-label="Admin">
    <div class="ml-nav-top"><span>Menu</span><button type="button" class="ml-ibtn" aria-label="Close" onclick="AdminMediaJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ml-amenu" id="ml-menu"></ul>
</aside>
<div class="ml-scrim" id="ml-scrim" onclick="AdminMediaJs.closeNav()"></div>
<main class="ml-amain" id="ml-main"><p class="ml-loading">Loading&hellip;</p></main>
<div class="ml-modal" id="ml-modal" onclick="if(event.target===this)AdminMediaJs.closeModal()">
    <div class="ml-mbox" role="dialog" aria-modal="true"><button type="button" class="ml-ibtn ml-mclose" aria-label="Close" onclick="AdminMediaJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ml-mbody"></div></div>
</div>
<div class="ml-toast" id="ml-toast" role="status" aria-live="polite"></div>
</div>
