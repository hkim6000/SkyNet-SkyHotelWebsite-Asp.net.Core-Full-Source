<div class="cm-site cm-admin" id="cm-site" data-theme="light" style="{plhd_style}">
<header class="cm-ahead">
    <button type="button" class="cm-ibtn cm-burger" aria-label="Menu" onclick="AdminMembersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="cm-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="cm-demo" id="cm-demo"></span>
    <span class="cm-grow"></span>
    <a class="cm-who" id="cm-who" href="AdminAccount"></a>
    <a class="cm-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="cm-out" onclick="AdminMembersJs.signOut()">Sign out</button>
</header>
<aside class="cm-side" id="cm-nav" aria-label="Admin">
    <div class="cm-nav-top"><span>Menu</span><button type="button" class="cm-ibtn" aria-label="Close" onclick="AdminMembersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="cm-amenu" id="cm-menu"></ul>
</aside>
<div class="cm-scrim" id="cm-scrim" onclick="AdminMembersJs.closeNav()"></div>
<main class="cm-amain" id="cm-main"><p class="cm-loading">Loading&hellip;</p></main>
<div class="cm-modal" id="cm-modal" onclick="if(event.target===this)AdminMembersJs.closeModal()">
    <div class="cm-mbox" role="dialog" aria-modal="true"><button type="button" class="cm-ibtn cm-mclose" aria-label="Close" onclick="AdminMembersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="cm-mbody"></div></div>
</div>
<div class="cm-toast" id="cm-toast" role="status" aria-live="polite"></div>
</div>
