<div class="po-site po-admin" id="po-site" data-theme="light" style="{plhd_style}">
<header class="po-ahead">
    <button type="button" class="po-ibtn po-burger" aria-label="Menu" onclick="AdminOffersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="po-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="po-demo" id="po-demo"></span>
    <span class="po-grow"></span>
    <a class="po-who" id="po-who" href="AdminAccount"></a>
    <a class="po-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="po-out" onclick="AdminOffersJs.signOut()">Sign out</button>
</header>
<aside class="po-side" id="po-nav" aria-label="Admin">
    <div class="po-nav-top"><span>Menu</span><button type="button" class="po-ibtn" aria-label="Close" onclick="AdminOffersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="po-amenu" id="po-menu"></ul>
</aside>
<div class="po-scrim" id="po-scrim" onclick="AdminOffersJs.closeNav()"></div>
<main class="po-amain" id="po-main"><p class="po-loading">Loading&hellip;</p></main>
<div class="po-modal" id="po-modal" onclick="if(event.target===this)AdminOffersJs.closeModal()">
    <div class="po-mbox" role="dialog" aria-modal="true"><button type="button" class="po-ibtn po-mclose" aria-label="Close" onclick="AdminOffersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="po-mbody"></div></div>
</div>
<div class="po-toast" id="po-toast" role="status" aria-live="polite"></div>
</div>
