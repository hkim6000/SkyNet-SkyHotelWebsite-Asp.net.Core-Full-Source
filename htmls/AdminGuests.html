<div class="gs-site gs-admin" id="gs-site" data-theme="light" style="{plhd_style}">
<header class="gs-ahead">
    <button type="button" class="gs-ibtn gs-burger" aria-label="Menu" onclick="AdminGuestsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="gs-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="gs-demo" id="gs-demo"></span>
    <span class="gs-grow"></span>
    <a class="gs-who" id="gs-who" href="AdminAccount"></a>
    <a class="gs-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="gs-out" onclick="AdminGuestsJs.signOut()">Sign out</button>
</header>
<aside class="gs-side" id="gs-nav" aria-label="Admin">
    <div class="gs-nav-top"><span>Menu</span><button type="button" class="gs-ibtn" aria-label="Close" onclick="AdminGuestsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="gs-amenu" id="gs-menu"></ul>
</aside>
<div class="gs-scrim" id="gs-scrim" onclick="AdminGuestsJs.closeNav()"></div>
<main class="gs-amain" id="gs-main"><p class="gs-loading">Loading&hellip;</p></main>
<div class="gs-modal" id="gs-modal" onclick="if(event.target===this)AdminGuestsJs.closeModal()">
    <div class="gs-mbox" role="dialog" aria-modal="true"><button type="button" class="gs-ibtn gs-mclose" aria-label="Close" onclick="AdminGuestsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="gs-mbody"></div></div>
</div>
<div class="gs-toast" id="gs-toast" role="status" aria-live="polite"></div>
</div>
