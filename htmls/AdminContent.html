<div class="ce-site ce-admin" id="ce-site" data-theme="light" style="{plhd_style}">
<header class="ce-ahead">
    <button type="button" class="ce-ibtn ce-burger" aria-label="Menu" onclick="AdminContentJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ce-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="ce-demo" id="ce-demo"></span>
    <span class="ce-grow"></span>
    <a class="ce-who" id="ce-who" href="AdminAccount"></a>
    <a class="ce-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ce-out" onclick="AdminContentJs.signOut()">Sign out</button>
</header>
<aside class="ce-side" id="ce-nav" aria-label="Admin">
    <div class="ce-nav-top"><span>Menu</span><button type="button" class="ce-ibtn" aria-label="Close" onclick="AdminContentJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ce-amenu" id="ce-menu"></ul>
</aside>
<div class="ce-scrim" id="ce-scrim" onclick="AdminContentJs.closeNav()"></div>
<main class="ce-amain" id="ce-main"><p class="ce-loading">Loading&hellip;</p></main>
<div class="ce-modal" id="ce-modal" onclick="if(event.target===this)AdminContentJs.closeModal()">
    <div class="ce-mbox" role="dialog" aria-modal="true"><button type="button" class="ce-ibtn ce-mclose" aria-label="Close" onclick="AdminContentJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ce-mbody"></div></div>
</div>
<div class="ce-toast" id="ce-toast" role="status" aria-live="polite"></div>
</div>
