<div class="hk-site hk-admin" id="hk-site" data-theme="light" style="{plhd_style}">
<header class="hk-ahead">
    <button type="button" class="hk-ibtn hk-burger" aria-label="Menu" onclick="AdminHousekeepingJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="hk-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="hk-demo" id="hk-demo"></span>
    <span class="hk-grow"></span>
    <a class="hk-who" id="hk-who" href="AdminAccount"></a>
    <a class="hk-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="hk-out" onclick="AdminHousekeepingJs.signOut()">Sign out</button>
</header>
<aside class="hk-side" id="hk-nav" aria-label="Admin">
    <div class="hk-nav-top"><span>Menu</span><button type="button" class="hk-ibtn" aria-label="Close" onclick="AdminHousekeepingJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="hk-amenu" id="hk-menu"></ul>
</aside>
<div class="hk-scrim" id="hk-scrim" onclick="AdminHousekeepingJs.closeNav()"></div>
<main class="hk-amain" id="hk-main"><p class="hk-loading">Loading&hellip;</p></main>
<div class="hk-modal" id="hk-modal" onclick="if(event.target===this)AdminHousekeepingJs.closeModal()">
    <div class="hk-mbox" role="dialog" aria-modal="true"><button type="button" class="hk-ibtn hk-mclose" aria-label="Close" onclick="AdminHousekeepingJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="hk-mbody"></div></div>
</div>
<div class="hk-toast" id="hk-toast" role="status" aria-live="polite"></div>
</div>
