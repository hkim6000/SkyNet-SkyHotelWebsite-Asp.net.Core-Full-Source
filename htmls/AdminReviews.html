<div class="rw-site rw-admin" id="rw-site" data-theme="light" style="{plhd_style}">
<header class="rw-ahead">
    <button type="button" class="rw-ibtn rw-burger" aria-label="Menu" onclick="AdminReviewsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="rw-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="rw-demo" id="rw-demo"></span>
    <span class="rw-grow"></span>
    <a class="rw-who" id="rw-who" href="AdminAccount"></a>
    <a class="rw-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="rw-out" onclick="AdminReviewsJs.signOut()">Sign out</button>
</header>
<aside class="rw-side" id="rw-nav" aria-label="Admin">
    <div class="rw-nav-top"><span>Menu</span><button type="button" class="rw-ibtn" aria-label="Close" onclick="AdminReviewsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="rw-amenu" id="rw-menu"></ul>
</aside>
<div class="rw-scrim" id="rw-scrim" onclick="AdminReviewsJs.closeNav()"></div>
<main class="rw-amain" id="rw-main"><p class="rw-loading">Loading&hellip;</p></main>
<div class="rw-modal" id="rw-modal" onclick="if(event.target===this)AdminReviewsJs.closeModal()">
    <div class="rw-mbox" role="dialog" aria-modal="true"><button type="button" class="rw-ibtn rw-mclose" aria-label="Close" onclick="AdminReviewsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rw-mbody"></div></div>
</div>
<div class="rw-toast" id="rw-toast" role="status" aria-live="polite"></div>
</div>
