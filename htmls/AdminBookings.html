<div class="bk-site bk-admin" id="bk-site" data-theme="light" style="{plhd_style}">
<header class="bk-ahead">
    <button type="button" class="bk-ibtn bk-burger" aria-label="Menu" onclick="AdminBookingsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="bk-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="bk-demo" id="bk-demo"></span>
    <span class="bk-grow"></span>
    <a class="bk-who" id="bk-who" href="AdminAccount"></a>
    <a class="bk-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="bk-out" onclick="AdminBookingsJs.signOut()">Sign out</button>
</header>
<aside class="bk-side" id="bk-nav" aria-label="Admin">
    <div class="bk-nav-top"><span>Menu</span><button type="button" class="bk-ibtn" aria-label="Close" onclick="AdminBookingsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="bk-amenu" id="bk-menu"></ul>
</aside>
<div class="bk-scrim" id="bk-scrim" onclick="AdminBookingsJs.closeNav()"></div>
<main class="bk-amain" id="bk-main"><p class="bk-loading">Loading&hellip;</p></main>
<div class="bk-modal" id="bk-modal" onclick="if(event.target===this)AdminBookingsJs.closeModal()">
    <div class="bk-mbox" role="dialog" aria-modal="true"><button type="button" class="bk-ibtn bk-mclose" aria-label="Close" onclick="AdminBookingsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="bk-mbody"></div></div>
</div>
<div class="bk-toast" id="bk-toast" role="status" aria-live="polite"></div>
</div>
