<div class="cl-site cl-admin" id="cl-site" data-theme="light" style="{plhd_style}">
<header class="cl-ahead">
    <button type="button" class="cl-ibtn cl-burger" aria-label="Menu" onclick="AdminCalendarJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="cl-abrand" href="Admin">{plhd_name}<span>Admin</span></a>
    <span class="cl-demo" id="cl-demo"></span>
    <span class="cl-grow"></span>
    <a class="cl-who" id="cl-who" href="AdminAccount"></a>
    <a class="cl-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="cl-out" onclick="AdminCalendarJs.signOut()">Sign out</button>
</header>
<aside class="cl-side" id="cl-nav" aria-label="Admin">
    <div class="cl-nav-top"><span>Menu</span><button type="button" class="cl-ibtn" aria-label="Close" onclick="AdminCalendarJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="cl-amenu" id="cl-menu"></ul>
</aside>
<div class="cl-scrim" id="cl-scrim" onclick="AdminCalendarJs.closeNav()"></div>
<main class="cl-amain" id="cl-main"><p class="cl-loading">Loading&hellip;</p></main>
<div class="cl-modal" id="cl-modal" onclick="if(event.target===this)AdminCalendarJs.closeModal()">
    <div class="cl-mbox" role="dialog" aria-modal="true"><button type="button" class="cl-ibtn cl-mclose" aria-label="Close" onclick="AdminCalendarJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="cl-mbody"></div></div>
</div>
<div class="cl-toast" id="cl-toast" role="status" aria-live="polite"></div>
</div>
